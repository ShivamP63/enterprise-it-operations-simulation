$kind: http-request
url: "{{baseUrl}}/get?service=inventory-api&incident={{incidentNumber}}"
method: GET
queryParams:
  service: inventory-api
  incident: "{{incidentNumber}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Health endpoint returns HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is below 2 seconds', function () { pm.expect(pm.response.responseTime).to.be.below(2000); });
    language: text/javascript
order: 1000
